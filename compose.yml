# ==============================================================================
# Neuralwire Status — Uptime Kuma Deployment Configuration
# Official Documentation: https://uptime.kuma.pet/
# Canonical Domain: https://neuralwire.info
# ==============================================================================

services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: neuralwire-status
    restart: unless-stopped
    ports:
      - "${UPTIME_KUMA_PORT:-3001}:3001"
    environment:
      - TZ=${TZ:-Asia/Jakarta}
      - NODE_ENV=${NODE_ENV:-production}
    volumes:
      - uptime-kuma-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node extra/healthcheck.js || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

volumes:
  uptime-kuma-data:
    name: neuralwire-status-data
